name: Upstream sync

on:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Check upstream and print summary without opening a PR or issue
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up toolchain
        uses: ./.github/actions/setup-toolchain

      - name: Prepare sync branch
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN || github.token }}
        run: |
          set -euo pipefail
          up_dir="$RUNNER_TEMP/upstream"
          mkdir -p "$up_dir"

          branch="chore/upstream-sync"
          existing_pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --state open --json number --jq '.[0].number // empty')
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          remote_sha=$(git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
            ls-remote --heads origin "refs/heads/${branch}" | awk '{print $1}')

          printf '%s\n' "$existing_pr" > "$up_dir/existing-pr.txt"
          printf '%s\n' "$remote_sha" > "$up_dir/remote-branch-sha.txt"

          if [ -n "$existing_pr" ] && [ -n "$remote_sha" ]; then
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
              fetch --depth=1 origin "refs/heads/${branch}"
            git checkout -B "$branch" FETCH_HEAD
            printf 'true\n' > "$up_dir/using-open-pr.txt"
          else
            printf 'false\n' > "$up_dir/using-open-pr.txt"
          fi

      - name: Fetch upstream commits and files
        run: |
          set -euo pipefail
          up_dir="$RUNNER_TEMP/upstream"
          mkdir -p "$up_dir"

          cursor_repo=$(node -p 'require("./.github/upstream-sync.json").cursor.repo')
          cursor_branch=$(node -p 'require("./.github/upstream-sync.json").cursor.branch')
          cursor_path=$(node -p 'require("./.github/upstream-sync.json").cursor.path')
          cursor_base=$(node -p 'require("./.github/upstream-sync.json").cursor.lastSyncedSha')

          git clone --branch "$cursor_branch" --single-branch --filter=blob:none --sparse \
            "https://github.com/${cursor_repo}.git" "$up_dir/cursor-plugins"
          git -C "$up_dir/cursor-plugins" sparse-checkout set "${cursor_path}/skills"
          cursor_head=$(git -C "$up_dir/cursor-plugins" rev-parse HEAD)
          printf '%s\n' "$cursor_head" > "$up_dir/cursor-sha.txt"

          node scripts/upstream-range.mjs --repo-dir "$up_dir/cursor-plugins" --base "$cursor_base" --head "$cursor_head" --path "$cursor_path" --commits-output "$up_dir/cursor-commits.json" --changed-output "$up_dir/cursor-changed.txt"

          pi_repo=$(node -p 'require("./.github/upstream-sync.json").piMimir.repo')
          pi_branch=$(node -p 'require("./.github/upstream-sync.json").piMimir.branch')
          pi_base=$(node -p 'require("./.github/upstream-sync.json").piMimir.lastCheckedSha')

          git clone --branch "$pi_branch" --single-branch --filter=blob:none --no-checkout \
            "https://github.com/${pi_repo}.git" "$up_dir/pi-mimir"
          pi_head=$(git -C "$up_dir/pi-mimir" rev-parse HEAD)
          printf '%s\n' "$pi_head" > "$up_dir/pi-mimir-sha.txt"

          pi_path_args=()
          while IFS= read -r watch_path; do
            [ -z "$watch_path" ] && continue
            pi_path_args+=(--path "$watch_path")
          done < <(node -e 'for (const p of require("./.github/upstream-sync.json").piMimir.watchPaths) console.log(p);')

          node scripts/upstream-range.mjs --repo-dir "$up_dir/pi-mimir" --base "$pi_base" --head "$pi_head" "${pi_path_args[@]}" --commits-output "$up_dir/pi-mimir-commits.json" --changed-output "$up_dir/pi-mimir-changed.txt"

      - name: Run upstream sync
        env:
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
        run: |
          set -euo pipefail
          up_dir="$RUNNER_TEMP/upstream"
          cursor_sha=$(tr -d '[:space:]' < "$up_dir/cursor-sha.txt")
          pi_sha=$(tr -d '[:space:]' < "$up_dir/pi-mimir-sha.txt")
          args=(
            --cursor-dir "$up_dir/cursor-plugins"
            --cursor-sha "$cursor_sha"
            --cursor-changed-file "$up_dir/cursor-changed.txt"
            --cursor-commits-file "$up_dir/cursor-commits.json"
            --pi-mimir-sha "$pi_sha"
            --pi-mimir-commits-file "$up_dir/pi-mimir-commits.json"
            --report-output "$up_dir/report.md"
            --summary-json "$up_dir/summary.json"
          )
          if [ "$DRY_RUN" = "true" ]; then
            args+=(--dry-run)
          fi
          node scripts/sync-upstream.mjs "${args[@]}"
          cat "$up_dir/report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify synced repository
        env:
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
          HOME: ${{ runner.temp }}/omp-home
          USERPROFILE: ${{ runner.temp }}/omp-home
        run: |
          set -euo pipefail
          mode=$(node -p 'JSON.parse(require("node:fs").readFileSync(process.env.RUNNER_TEMP + "/upstream/summary.json", "utf8")).mode')
          if [ "$DRY_RUN" != "true" ] && [ "$mode" = "pr" ]; then
            mkdir -p "$HOME"
            npm run check
          fi

      - name: Create or update sync PR or issue
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN || github.token }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
        run: |
          set -euo pipefail
          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run enabled; skipping PR/issue creation."
            exit 0
          fi

          summary="$RUNNER_TEMP/upstream/summary.json"
          report="$RUNNER_TEMP/upstream/report.md"
          mode=$(node -p 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")).mode' "$summary")
          short_sha=$(node -p 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")).shortSha' "$summary")
          using_open_pr=$(tr -d '[:space:]' < "$RUNNER_TEMP/upstream/using-open-pr.txt")
          existing_pr=$(tr -d '[:space:]' < "$RUNNER_TEMP/upstream/existing-pr.txt")
          remote_sha=$(tr -d '[:space:]' < "$RUNNER_TEMP/upstream/remote-branch-sha.txt")
          sync_issue_json() {
            gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 50 --json number,title \
              --jq '[.[] | select(.title | startswith("[upstream-sync]"))][0] // empty'
          }

          case "$mode" in
            pr)
              branch="chore/upstream-sync"
              if [ "$using_open_pr" != "true" ]; then
                git checkout -B "$branch"
              fi
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add -A
              if git diff --cached --quiet; then
                echo "No git changes to commit."
                exit 0
              fi
              title="chore(sync): sync upstream pstack to ${short_sha}"
              git commit -m "$title"

              auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
              git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
                push --force-with-lease="refs/heads/${branch}:${remote_sha}" origin "HEAD:refs/heads/${branch}"

              if [ -n "$existing_pr" ]; then
                gh pr edit "$existing_pr" --repo "$GITHUB_REPOSITORY" --title "$title" --body-file "$report"
              else
                gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" --title "$title" --body-file "$report"
              fi
              ;;
            issue)
              title="[upstream-sync] Upstream updates need manual porting (${short_sha})"
              existing_json=$(sync_issue_json)
              if [ -n "$existing_json" ]; then
                issue_num=$(printf '%s' "$existing_json" | node -pe 'JSON.parse(require("node:fs").readFileSync(0, "utf8")).number')
                old_title=$(printf '%s' "$existing_json" | node -pe 'JSON.parse(require("node:fs").readFileSync(0, "utf8")).title')
                gh issue edit "$issue_num" --repo "$GITHUB_REPOSITORY" --title "$title" --body-file "$report"
                if [[ "$old_title" != *"$short_sha"* ]]; then
                  gh issue comment "$issue_num" --repo "$GITHUB_REPOSITORY" --body "Detected new upstream changes at \`${short_sha}\`. Updated issue checklist above."
                fi
              else
                gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file "$report"
              fi
              ;;
            none)
              if [ "$using_open_pr" = "true" ]; then
                echo "Open sync PR #${existing_pr} is already up to date with upstream."
                exit 0
              fi
              existing_json=$(sync_issue_json)
              if [ -n "$existing_json" ]; then
                issue_num=$(printf '%s' "$existing_json" | node -pe 'JSON.parse(require("node:fs").readFileSync(0, "utf8")).number')
                gh issue close "$issue_num" --repo "$GITHUB_REPOSITORY" \
                  --comment "Upstream pstack is up to date at \`${short_sha}\`. Closing this tracking issue."
              else
                echo "Already up to date with upstream."
              fi
              ;;
            *)
              echo "Unexpected mode: $mode" >&2
              exit 1
              ;;
          esac
